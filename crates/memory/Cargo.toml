[package]
name = "nemo-relay-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider-neutral memory interfaces and reference implementations for NeMo Relay."
readme = "README.md"

[lints]
workspace = true

[features]
default = []
relay = ["dep:nemo-relay", "dep:serde", "dep:sha2"]

[dependencies]
async-trait = "0.1"
nemo-relay-types.workspace = true
nemo-relay = { workspace = true, default-features = false, optional = true }
serde_json = "1"
serde = { version = "1", features = ["derive"], optional = true }
sha2 = { version = "0.11", optional = true }
tokio = { version = "1", default-features = false, features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "test-util", "time"] }
